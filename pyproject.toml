[project]
name = "ytplan"
version = "0.1.0"
description = "40~50대 정보·공감형 유튜브 콘텐츠 기획 도구"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.8,<2", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ytplan = "ytplan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ytplan*"]

[tool.setuptools.package-data]
ytplan = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
